services:
  - type: web
    name: n8n-agentetelegram
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: DB_TYPE
        value: postgresdb
      - key: DB_POSTGRESDB_HOST
        fromDatabase:
          name: n8n-db
          property: host
      - key: DB_POSTGRESDB_PORT
        fromDatabase:
          name: n8n-db
          property: port
      - key: DB_POSTGRESDB_DATABASE
        fromDatabase:
          name: n8n-db
          property: database
      - key: DB_POSTGRESDB_USER
        fromDatabase:
          name: n8n-db
          property: user
      - key: DB_POSTGRESDB_PASSWORD
        fromDatabase:
          name: n8n-db
          property: password
      - key: PORT
        value: 5678
      - key: N8N_PROTOCOL
        value: https
      - key: N8N_HOST
        value: n8n-agentetelegram.onrender.com
      - key: N8N_EDITOR_BASE_URL
        value: https://n8n-agentetelegram.onrender.com
      - key: WEBHOOK_URL
        value: https://n8n-agentetelegram.onrender.com
      - key: N8N_TRUST_PROXY
        value: "true"

databases:
  - name: n8n-db
    databaseName: n8n
    user: n8n
